apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
  features:
    apm:
      enabled: true
    dogstatsd:
      originDetectionEnabled: true
    # Log collection explicitly DISABLED. The SELinux spc_t injection exists solely so
    # the agent can read /var/log/pods under enforcing SELinux, so with logs off it
    # must NOT be applied. This fixture is the control that keeps that conditional
    # honest — the other OpenShift injections (tolerations, UDS, tlsVerify) should
    # still appear here.
    logCollection:
      enabled: false
    liveProcessCollection:
      enabled: true
