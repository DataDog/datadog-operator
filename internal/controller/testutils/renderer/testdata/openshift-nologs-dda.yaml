apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
  features:
    apm:
      enabled: true
    dogstatsd:
      originDetectionEnabled: true
    # Log collection explicitly DISABLED.
    #
    # This fixture originally asserted the opposite of what it now pins. The SELinux
    # spc_t options were first scoped to log collection, following Datadog's
    # distributions page, which frames the override as log-collection-specific. That
    # is wrong: the node agent needs the super-privileged type to reach /proc,
    # /sys/fs/cgroup and the runtime socket, and to write the system-probe profile
    # into /var/lib/kubelet/seccomp. With logs off and spc_t absent, the seccomp-setup
    # init container fails with "Permission denied" and the pod crash-loops before any
    # agent container starts — reproduced on a DatadogAgent with no features at all.
    #
    # So spc_t must appear here, with logs disabled. That is what this fixture guards.
    logCollection:
      enabled: false
    liveProcessCollection:
      enabled: true
