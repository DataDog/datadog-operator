apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
  features:
    apm:
      enabled: true
    dogstatsd:
      originDetectionEnabled: true
    # Log collection explicitly DISABLED.
    #
    # This fixture originally asserted the opposite of what it now pins. The SELinux
    # Guards that spc_t is injected with log collection off: the node agent needs the
    # super-privileged type for /proc, /sys/fs/cgroup, the runtime socket and the
    # system-probe seccomp profile, not for reading pod logs.
    logCollection:
      enabled: false
    liveProcessCollection:
      enabled: true
