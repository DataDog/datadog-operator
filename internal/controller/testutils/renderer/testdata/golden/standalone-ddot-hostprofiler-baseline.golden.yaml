apiVersion: v1
data:
  otel-config.yaml: |2-

    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: "otelcol"
              scrape_interval: 60s
              static_configs:
                - targets: ["0.0.0.0:8888"]
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      datadog:
        api:
          key: ${env:DD_API_KEY}
          site: ${env:DD_SITE}
        sending_queue:
          batch:
           flush_timeout: 10s
    processors:
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tag
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      filter/drop-prometheus-internal-metrics:
        metrics:
          exclude:
            match_type: regexp
            metric_names:
              - ^scrape_.*$
              - ^up$
              - ^promhttp_metric_handler_errors_total$
    connectors:
      datadog/connector:
        traces:
          compute_top_level_by_span_kind: true
          peer_tags_aggregation: true
          compute_stats_by_span_kind: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8s_attributes]
          exporters: [datadog, datadog/connector]
        metrics:
          receivers: [otlp, datadog/connector]
          processors: [k8s_attributes]
          exporters: [datadog]
        metrics/prometheus:
          receivers: [prometheus]
          processors: [filter/drop-prometheus-internal-metrics, k8s_attributes]
          exporters: [datadog]
        logs:
          receivers: [otlp]
          processors: [k8s_attributes]
          exporters: [datadog]
