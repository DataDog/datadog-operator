apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
    kubelet:
      tlsVerify: false
  features:
    # Enabled on top of the cluster agent being disabled, to lock in that these
    # features self-disable (or keep working node-side) instead of silently
    # requiring Cluster Agent resources that will never be created.
    kubeStateMetricsCore:
      enabled: true
    orchestratorExplorer:
      enabled: true
    serviceDiscovery:
      enabled: true
  override:
    clusterAgent:
      disabled: true
