apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
    kubelet:
      tlsVerify: false
  features:
    # process-agent container + passwd volume
    liveProcessCollection:
      enabled: true
    # passwd volume (core or process-agent container)
    processDiscovery:
      enabled: true
    # system-probe container + src/modules/debugfs volumes
    oomKill:
      enabled: true
    tcpQueueLength:
      enabled: true
    # system-probe container + passwd/group/os-release volumes
    cws:
      enabled: true
    # security-agent container + passwd/group volumes
    cspm:
      enabled: true
