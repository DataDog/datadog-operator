apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent
spec:
  global:
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    clusterName: test-cluster
    # Fixed so the generated cluster-agent token Secret is deterministic for golden files.
    clusterAgentToken: golden-fixed-cluster-agent-token-0000000000
    # Explicitly TRUE — the opposite of what the operator would inject on OpenShift.
    # This must survive: the operator fills gaps, it does not overwrite user intent.
    kubelet:
      tlsVerify: true
  features:
    # UDS explicitly enabled and hostPort explicitly disabled — again the opposite of
    # the OpenShift defaults. Must survive untouched.
    apm:
      enabled: true
      hostPortConfig:
        enabled: false
      unixDomainSocketConfig:
        enabled: true
    dogstatsd:
      originDetectionEnabled: true
      unixDomainSocketConfig:
        enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    liveProcessCollection:
      enabled: true
  override:
    nodeAgent:
      # A user-chosen service account must not be replaced by an OpenShift default.
      serviceAccountName: my-own-agent-sa
      # A user-supplied pod securityContext. Note this REPLACES the whole
      # PodSecurityContext (override/podtemplatespec.go), including the operator's
      # default runAsUser: 0 — so the operator must not silently merge spc_t in here.
      securityContext:
        runAsUser: 1000
        seLinuxOptions:
          type: container_t
      # User tolerations. Tolerations are additive in the override layer, so any
      # OpenShift tolerations the operator adds should appear alongside these.
      tolerations:
        - key: my-own-taint
          operator: Exists
          effect: NoSchedule
    clusterAgent:
      serviceAccountName: my-own-dca-sa
