apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-no-errors
spec:
  features:
    apm:
      hostPortConfig:
        enabled: true
        hostPort: 8126
      unixDomainSocketConfig:
        enabled: true
    clusterChecks:
      enabled: true
    logCollection:
      containerCollectAll: true
      enabled: true
  global:
    credentials:
      apiSecret:
        keyName: api-key
        secretName: datadog-secret
      appSecret:
        keyName: app-key
        secretName: datadog-secret
    kubelet:
      tlsVerify: false
    logLevel: info
    site: datadoghq.com
  override:
    clusterAgent:
      customConfigurations:
        datadog-cluster.yaml:
          configData: |
            cluster_checks:
              enabled: true
            log_level: debug
      extraConfd:
        configDataMap:
          kubernetes_state.yaml: |-
            ad_identifiers:
              - kube-state-metrics
          mysql.yaml: 'cluster_check: true'
      image:
        name: cluster-agent
        tag: 7.50.0
      replicas: 2
    nodeAgent:
      customConfigurations:
        datadog.yaml:
          configData: |
            jmx_use_container_support: true
            log_level: debug
      image:
        name: agent
        tag: 7.50.0
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
