nameOverride: "datadog-no-errors"
datadog:
  site: "datadoghq.com"
  logLevel: "info"
  kubelet:
    tlsVerify: false
  
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  
  apm:
    portEnabled: true
    socketEnabled: true
    port: 8126
  
  logs:
    enabled: true
    containerCollectAll: true

  clusterChecks:
    enabled: true

agents:
  image:
    name: "agent"
    tag: "7.50.0"
  tolerations:
    - key: "node-role.kubernetes.io/master"
      effect: "NoSchedule"
  customAgentConfig:
    log_level: "debug"
    jmx_use_container_support: true

clusterAgent:
  replicas: 2
  image:
    name: "cluster-agent"
    tag: "7.50.0"
  confd:
    mysql.yaml: |-
      cluster_check: true
    kubernetes_state.yaml: |-
      ad_identifiers:
        - kube-state-metrics
  datadog_cluster_yaml:
    log_level: "debug"
    cluster_checks:
      enabled: true
