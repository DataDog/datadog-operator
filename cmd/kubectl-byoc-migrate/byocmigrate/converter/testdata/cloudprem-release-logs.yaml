# Source: cloudprem/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-cloudprem
  labels:
    helm.sh/chart: cloudprem-0.5.4
    app.kubernetes.io/name: cloudprem
    app.kubernetes.io/instance: logs
    app.kubernetes.io/version: "v0.1.34"
    app.kubernetes.io/managed-by: Helm
data:
  node.yaml: |-
    cloudprem:
      create_dd_logs_index: true
      create_dd_metrics_index: false
      create_dd_sketches_index: false
      create_dd_traces_index: false
      mtls_header: X-Amzn-Mtls-Clientcert
    cloudprem_listen_port: 7283
    data_dir: /quickwit/qwdata
    docs_clustering:
    - fingerprint:
      - kind: structure
    - fingerprint:
      - kind: raw
        path: source
    - fingerprint:
      - kind: raw
        path: status
    - fingerprint:
      - kind: tokenized
        path: message
    gossip_listen_port: 7282
    grpc:
      keep_alive:
        interval: 30s
        timeout: 10s
    health:
      listen_port: 7284
    indexer:
      split_store_max_num_bytes: 200G
      split_store_max_num_splits: 10000
    ingest_api:
      max_queue_disk_usage: 7.2GiB
      max_queue_memory_usage: 3.6GiB
    listen_address: 0.0.0.0
    metastore:
      postgres:
        max_connections: 50
        min_connections: 10
    searcher:
      aggregation_memory_limit: 500M
      fast_field_cache_capacity: 4.875G
      max_num_concurrent_split_searches: 40
      partial_request_cache_capacity: 187.5M
      split_footer_cache_capacity: 375M
    version: 0.8
