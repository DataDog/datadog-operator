# Source: cloudprem/templates/ingress/internal.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logs-cloudprem-internal
  labels:
    helm.sh/chart: cloudprem-0.5.4
    app.kubernetes.io/name: cloudprem
    app.kubernetes.io/instance: logs
    app.kubernetes.io/version: "v0.1.34"
    app.kubernetes.io/managed-by: Helm
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/readyz
    alb.ingress.kubernetes.io/healthcheck-port: "7284"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Ingest (Quickwit, ES, Datadog) endpoints to indexers
          - path: /api/v1/*/ingest
            pathType: ImplementationSpecific
            backend:
              service:
                name: logs-cloudprem-indexer
                port:
                  name: rest
          - path: /api/v1/_elastic/bulk
            pathType: Prefix
            backend:
              service:
                name: logs-cloudprem-indexer
                port:
                  name: rest
          - path: /api/v1/_elastic/*/_bulk
            pathType: ImplementationSpecific
            backend:
              service:
                name: logs-cloudprem-indexer
                port:
                  name: rest
          - path: /api/v2/logs
            pathType: Prefix
            backend:
              service:
                name: logs-cloudprem-indexer
                port:
                  name: rest
          # Index management API endpoints to metastores
          - path: /api/v1/indexes
            pathType: Prefix
            backend:
              service:
                name: logs-cloudprem-metastore
                port:
                  name: rest
          # Everything else to searchers
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: logs-cloudprem-searcher
                port:
                  name: rest
