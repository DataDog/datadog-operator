datadog-operator:
  # apiKeyExistingSecret -- Use existing Secret which stores API key instead of creating a new one

  ## If set, this parameter takes precedence over "apiKey".
  apiKeyExistingSecret:  # <DATADOG_API_KEY_SECRET>

  # appKeyExistingSecret -- Use existing Secret which stores APP key instead of creating a new one

  ## If set, this parameter takes precedence over "appKey".
  appKeyExistingSecret:  # <DATADOG_APP_KEY_SECRET>

  toolVersion: eks-addon
  datadogCRDs:
    crds:
      datadogMonitors: false
  image:
    repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/datadog/operator
    tag: 1.28.0
  operatorMetricsEnabled: false

# credentialsSecretSync -- Configures synchronization of Secrets Manager secrets to `datadog-secret`
## Configure `apiKey`, `appKey`, or both. Set each `secretsManagerSecretID` to the corresponding secret ARN or name.
## Set the corresponding `datadog-operator.apiKeyExistingSecret` or `datadog-operator.appKeyExistingSecret`
## value to `datadog-secret` for the Operator to consume a synchronized key.
## Requires Kubernetes Secret sync and EKS Pod Identity. To trigger synchronization, a running pod in the same
## namespace must mount a Secrets Store CSI volume that references `SecretProviderClass/datadog-credentials`.
## This can be any running pod; it does not need to be the Datadog Operator pod.
## The pod's service account must have an EKS Pod Identity association with permission to read the configured secrets.
## The Datadog Operator pod can mount the volume by configuring `datadog-operator.serviceAccount`,
## `datadog-operator.volumes`, and `datadog-operator.volumeMounts`.
## credentialsSecretSync:
##   apiKey:
##     secretsManagerSecretID: <ARN or name>
##   appKey:
##     secretsManagerSecretID: <ARN or name>
credentialsSecretSync: null
