{{- with .Values.credentialsSecretSync }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: datadog-credentials
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: datadog-ascp-secret-sync
    app.kubernetes.io/managed-by: eks-addon
spec:
  provider: aws
  secretObjects:
    - secretName: datadog-secret
      type: Opaque
      labels:
        app.kubernetes.io/managed-by: eks-addon
      data:
{{ if .apiKey }}
        - objectName: api-key
          key: api-key
{{ end }}
{{ if .appKey }}
        - objectName: app-key
          key: app-key
{{ end }}
  parameters:
    usePodIdentity: "true"
    objects: |
{{ if .apiKey }}
      - objectName: {{ .apiKey.secretsManagerSecretID | quote }}
        objectType: secretsmanager
        objectAlias: api-key
        filePermission: "0400"
{{ end }}
{{ if .appKey }}
      - objectName: {{ .appKey.secretsManagerSecretID | quote }}
        objectType: secretsmanager
        objectAlias: app-key
        filePermission: "0400"
{{ end }}
{{- end }}
