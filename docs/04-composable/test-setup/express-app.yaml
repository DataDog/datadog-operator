apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: otel-js-app:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
         - name: HOST_IP
           valueFrom:
             fieldRef:
               fieldPath: status.hostIP
         - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
           value: "http://datadog-agent.system.svc.cluster.local:4318/v1/traces"
         - name: OTEL_SERVICE_NAME
           value: "otel-js"
         # Lets infraattributes (Agent+DDOT) and k8s_attributes (standalone) find the pod.
         - name: POD_UID
           valueFrom:
             fieldRef:
               fieldPath: metadata.uid
         - name: OTEL_RESOURCE_ATTRIBUTES
           value: "k8s.pod.uid=$(POD_UID),k8s.container.name=app"
         # OTLP metrics from the SDK, e.g. HTTP server duration.
         - name: OTEL_METRICS_EXPORTER
           value: "otlp"
         - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
           value: "http://datadog-agent.system.svc.cluster.local:4318/v1/metrics"
         - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
           value: "http/protobuf"
         - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
           value: "delta"
         - name: OTEL_METRIC_EXPORT_INTERVAL
           value: "10000"
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo
spec:
  selector:
    app: app
  ports:
  - name: http
    protocol: TCP
    port: 3000
---
# Sends requests to the app, including errors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-load
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-load
  template:
    metadata:
      labels:
        app: app-load
    spec:
      containers:
      - name: curl
        image: curlimages/curl:latest
        command: ["sh", "-c", "while true; do curl -s -o /dev/null http://app:3000/; curl -s -o /dev/null http://app:3000/error; sleep 2; done"]
