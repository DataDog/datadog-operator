include:
  - local: .gitlab/ci/e2e-common.yml

image: registry.ddbuild.io/images/mirror/library/golang:1.26.10
variables:
  NIGHTLY_BUILD_CONDUCTOR_NAME: "operator-nightly-build"
  PROJECTNAME: "datadog-operator"
  PROJECTNAME_CHECK: "datadog-operator-check"
  IMAGE_VERSION: "tmpl-v5"
  BUILD_DOCKER_REGISTRY: "486234852809.dkr.ecr.us-east-1.amazonaws.com/ci"
  E2E_DOCKER_REGISTRY: "669783387624.dkr.ecr.us-east-1.amazonaws.com/operator"
  JOB_DOCKER_IMAGE: "registry.ddbuild.io/ci-containers-project:v68399443-88dc260-v1.22"
  OCTO_JOB_DOCKER_IMAGE: "registry.ddbuild.io/ci-containers-project:v73151907-c38dce1-v1.22.1"
  DOCKER_REGISTRY_LOGIN_SSM_KEY: docker_hub_login
  DOCKER_REGISTRY_PWD_SSM_KEY: docker_hub_pwd
  DOCKER_REGISTRY_URL: docker.io
  RH_PARTNER_REGISTRY: "quay.io/redhat-isv-containers"
  RH_PARTNER_PROJECT_ID: "5e7c8ebc1c86a3163d1a69be"
  RH_PARTNER_REGISTRY_USER: "redhat-isv-containers+5e7c8ebc1c86a3163d1a69be-robot"
  RH_PARTNER_REGISTRY_KEY_SSM_KEY: redhat_registry_key
  RH_PARTNER_API_KEY_SSM_KEY: redhat_api_key
  # Image version from datadog-agent-buildimages (same as datadog-agent main branch)
  CI_IMAGE_LINUX: v102144341-64dad9f8
  CI_IMAGE_LINUX_SUFFIX: ""
  PUSH_IMAGES_TO_STAGING:
    description: "Set PUSH_IMAGE_TO_STAGING to 'true' if you want to push the operator to internal staging registry."
  FIPS_ENABLED: false
  FF_TIMESTAMPS: true
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

.resource_variables: &resource_variables
  KUBERNETES_MEMORY_REQUEST: 16Gi
  KUBERNETES_MEMORY_LIMIT: 16Gi
  KUBERNETES_CPU_REQUEST: 4
  KUBERNETES_CPU_LIMIT: 4
  GOMEMLIMIT: 15GiB
  GOMAXPROCS: 4

stages:
  - build_and_test
  - ci_selftest
  - image
  - deps_fetch
  - e2e
  - release
  - release-latest
  - post-release
  - deploy

.on_build_images:
  - if: "$CI_COMMIT_BRANCH =~ /^mq-working-branch-/"
    when: never
  - when: on_success

# Release-bundle PRs are opened by the operator-release bot on `operator-release/*`
# branches and only ever contain the regenerated bundle manifests plus
# config/manager/kustomization.yaml. There is no operator code for e2e to
# exercise, so skip the whole e2e stage to get them through CI quickly.
#
# The second clause covers the mergequeue: once queued, the pipeline runs on
# `mq-working-branch-*` and the original branch name is gone, so match the
# squashed commit title instead. The bot always titles these PRs
# `[datadog-operator] Release vX.Y.Z` (see operatorrelease/worker/buildtag.go).
.skip_e2e_on_release_bundle_branch: &skip_e2e_on_release_bundle_branch
  if: '$CI_COMMIT_BRANCH =~ /^operator-release\// || ($CI_COMMIT_BRANCH =~ /^mq-working-branch-/ && $CI_COMMIT_TITLE =~ /^\[datadog-operator\] Release v/)'
  when: never

# Reuse the existing daily Conductor build for Autopilot release QA. Keep this
# ahead of change-based and DDR exclusions.
.on_run_autopilot_nightly: &on_run_autopilot_nightly
  if: '$CI_COMMIT_BRANCH == "main" && $DDR == "true" && $CONDUCTOR_TARGET == $NIGHTLY_BUILD_CONDUCTOR_NAME'
  when: on_success
  allow_failure: true

# Keep the core checks in one pod so each step reuses modules, tools, and
# compilation from the previous steps. Check generated diffs immediately so
# later steps cannot hide changes; GitLab stops on the first failed command.
build_and_test:
  stage: build_and_test
  retry: 2
  tags: ["arch:amd64"]
  variables:
    <<: *resource_variables
  script:
    # DDR historically runs build/generation/lint, without the other checks.
    - if [ "$DDR" = "true" ]; then make build; exit $?; fi
    - make ci-build
    - make update-golang
    - git diff --exit-code
    - make verify-licenses
    - make generate
    - git diff --exit-code
    - make fmt
    - git diff --exit-code
    - make lint
    - make ci-test

lint_e2e:
  # Download modules in this pod; without a shared cache there is no deps gate.
  # Keeping this in the e2e stage also lets image builds proceed during lint.
  stage: e2e
  retry: 2
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64"]
  needs: []
  rules:
    - *skip_e2e_on_release_bundle_branch
    - if: '$DDR == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "test/e2e/**/*"
          - ".gitlab-ci.yml"
          - ".gitlab/ci/**/*"
          - "Makefile"
        compare_to: "refs/heads/main"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  variables:
    <<: *resource_variables
  script:
    - make lint-e2e

build_operator_image_amd64:
  stage: image
  retry: 2
  timeout: 20m
  tags:
    - "arch:amd64"
  image: $JOB_DOCKER_IMAGE
  variables:
    <<: *resource_variables
    GOARCH: amd64
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-amd64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:$CI_COMMIT_TAG-amd64
  script:
    # DockerHub login for build to limit rate limit when pulling base images
    - DOCKER_REGISTRY_LOGIN=$(aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_LOGIN_SSM_KEY --with-decryption --query "Parameter.Value" --out text)
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_PWD_SSM_KEY --with-decryption --query "Parameter.Value" --out text | docker login --username "$DOCKER_REGISTRY_LOGIN" --password-stdin "$DOCKER_REGISTRY_URL"
    - IMG=$TARGET_IMAGE FIPS_ENABLED=$FIPS_ENABLED make docker-build-push-ci
    - if [ -n "$CI_COMMIT_TAG" ]; then docker buildx imagetools create $TARGET_IMAGE --tag $RELEASE_IMAGE; fi

build_operator_image_fips_amd64:
  extends: build_operator_image_amd64
  rules: !reference [.on_build_images]
  variables:
    <<: *resource_variables
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-fips-amd64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:$CI_COMMIT_TAG-fips-amd64
    FIPS_ENABLED: "true"

build_operator_image_arm64:
  stage: image
  retry: 2
  timeout: 20m
  rules: !reference [.on_build_images]
  tags:
    - "arch:arm64"
  image: $JOB_DOCKER_IMAGE
  variables:
    <<: *resource_variables
    GOARCH: arm64
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-arm64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:$CI_COMMIT_TAG-arm64
  script:
    # DockerHub login for build to limit rate limit when pulling base images
    - DOCKER_REGISTRY_LOGIN=$(aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_LOGIN_SSM_KEY --with-decryption --query "Parameter.Value" --out text)
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_PWD_SSM_KEY --with-decryption --query "Parameter.Value" --out text | docker login --username "$DOCKER_REGISTRY_LOGIN" --password-stdin "$DOCKER_REGISTRY_URL"
    - IMG=$TARGET_IMAGE FIPS_ENABLED=$FIPS_ENABLED make docker-build-push-ci
    - if [ -n "$CI_COMMIT_TAG" ]; then docker buildx imagetools create $TARGET_IMAGE --tag $RELEASE_IMAGE; fi

build_operator_image_fips_arm64:
  extends: build_operator_image_arm64
  variables:
    <<: *resource_variables
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-fips-arm64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:$CI_COMMIT_TAG-fips-arm64
    FIPS_ENABLED: "true"

build_operator_check_image_amd64:
  stage: image
  retry: 2
  timeout: 20m
  rules: !reference [.on_build_images]
  tags:
    - "arch:amd64"
  image: $JOB_DOCKER_IMAGE
  variables:
    <<: *resource_variables
    GOARCH: amd64
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME_CHECK:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-amd64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME_CHECK:$CI_COMMIT_TAG-amd64
  script:
    # DockerHub login for build to limit rate limit when pulling base images
    - DOCKER_REGISTRY_LOGIN=$(aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_LOGIN_SSM_KEY --with-decryption --query "Parameter.Value" --out text)
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_PWD_SSM_KEY --with-decryption --query "Parameter.Value" --out text | docker login --username "$DOCKER_REGISTRY_LOGIN" --password-stdin "$DOCKER_REGISTRY_URL"
    - IMG_CHECK=$TARGET_IMAGE make docker-build-push-check-ci
    - if [ -n "$CI_COMMIT_TAG" ]; then docker buildx imagetools create $TARGET_IMAGE --tag $RELEASE_IMAGE; fi

build_operator_check_image_arm64:
  stage: image
  retry: 2
  timeout: 20m
  rules: !reference [.on_build_images]
  tags:
    - "arch:arm64"
  image: $JOB_DOCKER_IMAGE
  variables:
    GOARCH: arm64
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME_CHECK:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-arm64
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME_CHECK:$CI_COMMIT_TAG-arm64
  script:
    # DockerHub login for build to limit rate limit when pulling base images
    - DOCKER_REGISTRY_LOGIN=$(aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_LOGIN_SSM_KEY --with-decryption --query "Parameter.Value" --out text)
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.$DOCKER_REGISTRY_PWD_SSM_KEY --with-decryption --query "Parameter.Value" --out text | docker login --username "$DOCKER_REGISTRY_LOGIN" --password-stdin "$DOCKER_REGISTRY_URL"
    - IMG_CHECK=$TARGET_IMAGE make docker-build-push-check-ci
    - if [ -n "$CI_COMMIT_TAG" ]; then docker buildx imagetools create $TARGET_IMAGE --tag $RELEASE_IMAGE; fi

build_bundle_image:
  stage: image
  retry: 2
  timeout: 20m
  rules: !reference [.on_build_images]
  tags:
    - "arch:amd64"
  image: $JOB_DOCKER_IMAGE
  variables:
    TARGET_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-bundle
    RELEASE_IMAGE: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:$CI_COMMIT_TAG-bundle
  script:
    - BUNDLE_IMG=$TARGET_IMAGE make bundle-build-push
    - if [ -n "$CI_COMMIT_TAG" ]; then docker buildx imagetools create $TARGET_IMAGE --tag $RELEASE_IMAGE; fi

prepare_e2e_plugins:
  extends: .prepare_e2e_plugins_base
  rules:
    # Nightly QA prepares its own dependencies in the detached child pipeline.
    - <<: *on_run_autopilot_nightly
      when: never
    - *skip_e2e_on_release_bundle_branch
    - when: on_success

.on_run_e2e_base:
  - *skip_e2e_on_release_bundle_branch
  # Skip if only .md files are changed
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
        - "*.md"
      compare_to: "refs/heads/main"
    when: never
  # Allow mergequeue branches to merge even if tests fail
  - if: "$CI_COMMIT_BRANCH =~ /^mq-working-branch-/"
    allow_failure: true
  - if: $CI_COMMIT_TAG
    allow_failure: true
  # Make e2e optional when pushing custom builds to staging
  - if: $PUSH_IMAGES_TO_STAGING == 'true'
    when: manual
    allow_failure: true
  # Disable on Conductor-triggered jobs (ex: nightly)
  - if: '$DDR == "true"'
    when: never
  # Run automatically otherwise
  - when: on_success

.on_run_e2e:
  - *skip_e2e_on_release_bundle_branch
  # Skip if only .md files are changed
  - if: $CI_COMMIT_BRANCH
    changes:
      paths:
        - "*.md"
      compare_to: "refs/heads/main"
    when: never
  # Skip on mergequeue branches (handled by e2e_mq)
  - if: "$CI_COMMIT_BRANCH =~ /^mq-working-branch-/"
    when: never
  - if: $CI_COMMIT_TAG
    allow_failure: true
  # Make e2e optional when pushing custom builds to staging
  - if: $PUSH_IMAGES_TO_STAGING == 'true'
    when: manual
    allow_failure: true
  # Disable on Conductor-triggered jobs (ex: nightly)
  - if: '$DDR == "true"'
    when: never
  # Run automatically otherwise
  - when: on_success

# Base configuration for E2E jobs requiring AWS/Pulumi setup
.e2e_aws_base:
  tags:
    - "arch:amd64"
  variables:
    <<: *resource_variables
    E2E_AWS_PUBLIC_KEY_PATH: /tmp/agent-qa-ssh-key.pub
    E2E_AWS_PRIVATE_KEY_PATH: /tmp/agent-qa-ssh-key
    E2E_KEY_PAIR_NAME: ci.datadog-operator
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  before_script:
    # Restore the Go caches and plugins prepared once for this pipeline.
    - tar xJf e2e_go_cache.tar.xz -C "$CI_PROJECT_DIR"
    - rm -f e2e_go_cache.tar.xz
    - mkdir -p ~/.pulumi && tar xJf pulumi_plugins.tar.xz -C ~/.pulumi
    - rm -f pulumi_plugins.tar.xz
    # Generate GitHub token to avoid rate limiting when downloading Pulumi plugins
    - dd-octo-sts version
    - dd-octo-sts debug --scope DataDog/datadog-operator --policy self.gitlab.e2e
    - export GITHUB_TOKEN=$(dd-octo-sts token --scope DataDog/datadog-operator --policy self.gitlab.e2e)
    # Setup AWS Credentials
    - echo "Starting setup for E2E testing..."
    - mkdir -p ~/.aws
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.agent-qa-profile --with-decryption --query "Parameter.Value" --out text >> ~/.aws/config
    - export AWS_PROFILE=agent-qa-ci
    # Now all `aws` commands target the agent-qa profile
    - echo "Retrieving SSH keys from AWS..."
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.ssh_public_key --with-decryption --query "Parameter.Value" --out text > $E2E_AWS_PUBLIC_KEY_PATH
    - aws ssm get-parameter --region us-east-1 --name ci.datadog-operator.ssh_private_key --with-decryption --query "Parameter.Value" --out text > $E2E_AWS_PRIVATE_KEY_PATH
    # Use S3 backend to store stack status
    - echo "Logging in to Pulumi with S3 backend..."
    - pulumi login "s3://dd-pulumi-state?region=us-east-1&awssdk=v2&profile=$AWS_PROFILE"

# Exercise the shared argument builder without contacting a registry.
test_publish_image_merge_strategy:
  stage: ci_selftest
  retry: 2
  extends: .docker_publish_job_definition
  needs: []
  rules:
    - if: '$DDR == "true"'
      when: never
    - changes:
        paths:
          - .gitlab-ci.yml
          - .gitlab/ci/e2e-common.yml
        compare_to: refs/heads/main
    - when: never
  variables:
    IMG_MERGE_STRATEGY: "index_oci"
  before_script:
    - |
      dd-pkg() {
        if [[ "${1:-}" == "version" ]]; then
          return 0
        fi

        local args=("$@")
        local i
        for ((i = 0; i < ${#args[@]} - 1; i++)); do
          if [[ "${args[$i]}" == "--merge-strategy" && "${args[$((i + 1))]}" == "${IMG_MERGE_STRATEGY}" ]]; then
            echo "merge strategy argument forwarded successfully"
            return 0
          fi
        done

        echo "missing --merge-strategy ${IMG_MERGE_STRATEGY} argument" >&2
        return 1
      }

trigger_e2e_operator_image:
  stage: e2e
  retry: 2
  rules: !reference [.on_run_e2e_base]
  needs:
    - build_operator_image_amd64
  extends: .docker_publish_job_definition
  variables:
    IMG_SOURCES: $BUILD_DOCKER_REGISTRY/$PROJECTNAME:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}-amd64
    IMG_DESTINATIONS: operator:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
    IMG_REGISTRIES: agent-qa

e2e:
  extends: .e2e_aws_base
  stage: e2e
  needs:
    - "trigger_e2e_operator_image"
    - "prepare_e2e_plugins"
  rules: !reference [.on_run_e2e]
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  parallel:
    matrix:
      - K8S_VERSION:
          - "1.19"
          - "1.22"
          - "1.24"
          - "1.25"
          - "1.26"
          - "1.29"
          - "1.30"
          - "1.32"
          - "1.36"
  variables:
    TARGET_IMAGE: $E2E_DOCKER_REGISTRY:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  script:
    - echo "Running e2e test with target image $TARGET_IMAGE"
    - IMAGE_PULL_PASSWORD=$(aws ecr get-login-password) IMG=$TARGET_IMAGE make e2e-tests
  retry: 2

e2e_mq:
  extends: e2e
  timeout: 60m
  rules:
    - *skip_e2e_on_release_bundle_branch
    # Skip if only .md files are changed
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "*.md"
        compare_to: "refs/heads/main"
      when: never
    # Only run on mergequeue branches with allow_failure
    - if: "$CI_COMMIT_BRANCH =~ /^mq-working-branch-/"
      allow_failure: true
    # Don't run otherwise
    - when: never

e2e_autoscaling:
  extends: .e2e_aws_base
  stage: e2e
  needs:
    - "prepare_e2e_plugins"
    # Reuse the successful core checks instead of running lint/vet again in E2E.
    - job: "build_and_test"
      artifacts: false
  timeout: 150m
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  rules:
    - *skip_e2e_on_release_bundle_branch
    # Disable on Conductor-triggered jobs (ex: nightly) - must be first so it wins
    - if: '$DDR == "true"'
      when: never
    # Disable on manual pipelines to test staging images
    - if: $PUSH_IMAGES_TO_STAGING == 'true'
      when: never
    # Skip on mergequeue branches: the suite takes ~2h (EKS cluster setup and
    # repeated install/uninstall cycles), which exceeds the mergequeue 2h timeout
    # and cancels the whole queue pipeline. It still runs on the PR pipeline.
    - if: "$CI_COMMIT_BRANCH =~ /^mq-working-branch-/"
      when: never
    # Run automatically on changes to autoscaling code
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "cmd/kubectl-datadog/autoscaling/**/*"
          - "test/e2e/tests/autoscaling_suite/**/*"
          - "test/e2e/provisioners/eks.go"
          - "test/e2e/common/autoscaling.go"
      when: on_success
    # Allow manual run otherwise
    - when: manual
      allow_failure: true
  script:
    - echo "Running autoscaling e2e tests"
    - make e2e-autoscaling-tests
  retry: 2

# Do not mirror or depend on the child status: slow or failing QA must not hold
# up the nightly image publication, deployment, or the parent Conductor step.
trigger_autopilot_nightly:
  stage: e2e
  rules:
    - *on_run_autopilot_nightly
    - when: never
  needs:
    - job: build_operator_image_amd64
      artifacts: false
  inherit:
    variables:
      # The nightly rule needs this default variable before the child is created.
      - NIGHTLY_BUILD_CONDUCTOR_NAME
      - BUILD_DOCKER_REGISTRY
      - E2E_DOCKER_REGISTRY
      - PROJECTNAME
      - CI_IMAGE_LINUX
      - CI_IMAGE_LINUX_SUFFIX
      - FF_TIMESTAMPS
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    CONDUCTOR_TARGET: $CONDUCTOR_TARGET
    DDR: $DDR
  trigger:
    include:
      - local: .gitlab/ci/autopilot-nightly.yml

e2e_gke_autopilot:
  extends: .e2e_gcp_base
  stage: e2e
  needs:
    - "trigger_e2e_operator_image"
    - "prepare_e2e_plugins"
  timeout: 120m
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  rules:
    - *skip_e2e_on_release_bundle_branch
    # Skip if only .md files are changed. The operator image trigger uses the same
    # guard, so this job must be excluded instead of depending on a missing job.
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "*.md"
        compare_to: "refs/heads/main"
      when: never
    # Nightly QA runs in a detached child pipeline instead.
    - if: '$DDR == "true"'
      when: never
    # Keep optional manual runs available on other pipelines.
    - when: manual
      allow_failure: true
  variables:
    TARGET_IMAGE: $E2E_DOCKER_REGISTRY:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  script:
    - echo "Running GKE Autopilot e2e test with target image $TARGET_IMAGE"
    - IMAGE_PULL_PASSWORD=$(aws ecr get-login-password) IMG=$TARGET_IMAGE make e2e-gke-autopilot-tests
  retry: 2

e2e_untaint:
  extends: .e2e_aws_base
  stage: e2e
  needs:
    # Needs the operator image (unlike autoscaling, which exercises the CLI).
    - "trigger_e2e_operator_image"
    - "prepare_e2e_plugins"
  timeout: 100m
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  variables:
    # Untaint controller is supported on Kubernetes 1.27.0+; pin a single recent
    # version rather than running the full e2e matrix.
    K8S_VERSION: "1.30"
    TARGET_IMAGE: $E2E_DOCKER_REGISTRY:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  rules:
    - *skip_e2e_on_release_bundle_branch
    # Skip when a root *.md file changed (docs-only *or* docs mixed with code).
    # This has to gate every rule below because the hard `needs` above
    # (trigger_e2e_operator_image, via .on_run_e2e_base) itself skips on any
    # root markdown change. Letting this job run on such a pipeline would leave
    # it depending on a job that isn't there, which GitLab rejects as a missing
    # need. So the mixed-changes "skip" is required for consistency, not a docs
    # optimization we can simply drop like the other e2e suites.
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "*.md"
        compare_to: "refs/heads/main"
      when: never
    # Disable on Conductor-triggered jobs (ex: nightly)
    - if: '$DDR == "true"'
      when: never
    # Disable on manual pipelines to test staging images
    - if: $PUSH_IMAGES_TO_STAGING == 'true'
      when: never
    # Run automatically on changes to untaint controller / suite code.
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "internal/controller/untaint_controller.go"
          - "internal/controller/datadogagent/component/agent/untaint_toleration.go"
          - "internal/controller/datadogcsidriver/**/*"
          - "pkg/untaint/**/*"
          - "test/e2e/tests/untaint_suite/**/*"
          - "test/e2e/provisioners/kind.go"
        compare_to: "refs/heads/main"
      when: on_success
    # On pipelines that don't touch untaint code, expose it as an optional manual
    # button. allow_failure here only affects this fallback rule, so it keeps
    # unrelated pipelines from being blocked without weakening the on_success gate.
    - when: manual
      allow_failure: true
  script:
    - echo "Running untaint controller e2e tests with target image $TARGET_IMAGE"
    - IMAGE_PULL_PASSWORD=$(aws ecr get-login-password) IMG=$TARGET_IMAGE make e2e-untaint-tests
  retry: 2

e2e_componenthealth:
  extends: .e2e_aws_base
  stage: e2e
  needs:
    # Needs the operator image (the suite deploys the operator and asserts its metrics).
    - "trigger_e2e_operator_image"
    - "prepare_e2e_plugins"
  timeout: 70m
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  variables:
    # ComponentHealth is a recent feature; pin a single recent Kubernetes version
    # rather than running the full e2e matrix.
    K8S_VERSION: "1.30"
    TARGET_IMAGE: $E2E_DOCKER_REGISTRY:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  rules:
    - *skip_e2e_on_release_bundle_branch
    # Skip when a root *.md file changed (docs-only or docs mixed with code); the
    # hard `needs` above itself skips on root markdown changes, so letting this
    # job run would leave it depending on an absent need (mirrors e2e_untaint).
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "*.md"
        compare_to: "refs/heads/main"
      when: never
    # Disable on Conductor-triggered jobs (ex: nightly)
    - if: '$DDR == "true"'
      when: never
    # Disable on manual pipelines to test staging images
    - if: $PUSH_IMAGES_TO_STAGING == 'true'
      when: never
    # Run automatically on changes to component-health controller / suite code.
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - "internal/controller/componenthealth_controller.go"
          - "internal/controller/componenthealth_snapshot_emitter.go"
          - "pkg/componenthealth/**/*"
          # Component-health wiring whose regression breaks this exact E2E flow:
          # cmd/main.go (flags/env + enabling pod-status caching), setup.go
          # (controller + emitter wiring), and pkg/config/config.go (the cache
          # transform that retains Pod.Status for detection).
          - "cmd/main.go"
          - "internal/controller/setup.go"
          - "pkg/config/config.go"
          - "test/e2e/tests/componenthealth_suite/**/*"
          - "test/e2e/provisioners/kind.go"
        compare_to: "refs/heads/main"
      when: on_success
    # On pipelines that don't touch component-health code, expose it as an optional
    # manual button (allow_failure scopes to this fallback rule only).
    - when: manual
      allow_failure: true
  script:
    - echo "Running component-health controller e2e tests with target image $TARGET_IMAGE"
    - IMAGE_PULL_PASSWORD=$(aws ecr get-login-password) IMG=$TARGET_IMAGE make e2e-componenthealth-tests
  retry: 2

publish_public_main:
