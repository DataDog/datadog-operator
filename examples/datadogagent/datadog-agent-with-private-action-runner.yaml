# Private Action Runner (PAR) enables workflow automation capabilities in the Datadog Agent.
# Configure PAR through spec.features.privateActionRunner. Shared settings apply
# to both agents; nodeAgent and clusterAgent override individual settings.
# Component configData replaces the entire shared YAML configuration.
# Typed actions_allowlist settings take precedence over configData.
# When the feature block is absent, legacy annotations remain supported.
#
# For more information about Private Action Runner:
# https://docs.datadoghq.com/actions/private_actions/

---
# Example 1: Shared configuration for both agents
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actions_allowlist:
        - com.datadoghq.script.runPredefinedScript

---
# Example 2: Shared enablement with separate configuration for the Cluster Agent
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-par-overrides
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actions_allowlist:
        - com.datadoghq.script.runPredefinedScript
      nodeAgent:
        # Split mode defaults to true for supported Agent images (7.84.0+).
        splitEnabled: true
        # Set enabled: false here to run PAR only in the Cluster Agent.
      clusterAgent:
        # Set enabled: false here to run PAR only in the Node Agent.
        # Replace the common allowlist only for the Cluster Agent.
        # Use actions_allowlist: [] to explicitly clear the common list.
        actions_allowlist:
          - com.datadoghq.http.request
        configData: |
          private_action_runner:
            self_enroll: true
            identity_secret_name: datadog-cluster-par-identity

---
# Legacy example 1: Node Agent with Private Action Runner (self-enrollment)
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-node-par
  annotations:
    # Enable Private Action Runner for Node Agent
    agent.datadoghq.com/private-action-runner-enabled: "true"
    # Grant PAR access to host systemd and select persistent, volatile, or both journal stores
    agent.datadoghq.com/private-action-runner-systemd-enabled: "true"
    agent.datadoghq.com/private-action-runner-systemd-journal-storage: "persistent"
    # Allow journal vacuum actions to delete archived journals in the selected directories
    agent.datadoghq.com/private-action-runner-systemd-journal-vacuum-enabled: "true"
    # Configure PAR using YAML configuration
    agent.datadoghq.com/private-action-runner-configdata: |
      private_action_runner:
        enabled: true
        self_enroll: true
        actions_allowlist:
          - com.datadoghq.http.request
          - com.datadoghq.kubernetes.core.listPod
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiKey: <DATADOG_API_KEY>
      appKey: <DATADOG_APP_KEY>
    site: datadoghq.com

---
# Legacy example 2: Cluster Agent with Private Action Runner (self-enrollment)
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-cluster-par
  annotations:
    # Enable Private Action Runner for Cluster Agent
    cluster-agent.datadoghq.com/private-action-runner-enabled: "true"
    # Configure PAR using YAML configuration
    cluster-agent.datadoghq.com/private-action-runner-configdata: |
      private_action_runner:
        enabled: true
        self_enroll: true
        identity_secret_name: datadog-par-identity
        actions_allowlist:
          - com.datadoghq.http.request
          - com.datadoghq.kubernetes.core.listPod
          - com.datadoghq.traceroute
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiKey: <DATADOG_API_KEY>
      appKey: <DATADOG_APP_KEY>
    site: datadoghq.com

---
# Legacy example 3: Cluster Agent with manual enrollment (URN and private key)
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-cluster-par-manual
  annotations:
    cluster-agent.datadoghq.com/private-action-runner-enabled: "true"
    cluster-agent.datadoghq.com/private-action-runner-configdata: |
      private_action_runner:
        enabled: true
        self_enroll: false
        urn: "urn:dd:apps:on-prem-runner:us1:123456:runner-abc123"
        private_key: "<YOUR_PRIVATE_KEY>"
        identity_secret_name: datadog-par-identity
        actions_allowlist:
          - com.datadoghq.http.request
          - com.datadoghq.kubernetes.core.listPod
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiKey: <DATADOG_API_KEY>
      appKey: <DATADOG_APP_KEY>
    site: datadoghq.com

---
# Legacy example 4: Both Node Agent and Cluster Agent with PAR
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-full-par
  annotations:
    # Enable PAR for Node Agent
    agent.datadoghq.com/private-action-runner-enabled: "true"
    agent.datadoghq.com/private-action-runner-configdata: |
      private_action_runner:
        enabled: true
        self_enroll: true
        actions_allowlist:
          - com.datadoghq.script.testConnection
          - com.datadoghq.kubernetes.core.listPod
    # Enable PAR for Cluster Agent
    cluster-agent.datadoghq.com/private-action-runner-enabled: "true"
    cluster-agent.datadoghq.com/private-action-runner-configdata: |
      private_action_runner:
        enabled: true
        self_enroll: true
        identity_secret_name: datadog-cluster-par-identity
        actions_allowlist:
          - com.datadoghq.http.request
          - com.datadoghq.traceroute
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiKey: <DATADOG_API_KEY>
      appKey: <DATADOG_APP_KEY>
    site: datadoghq.com
