# Enable PAR on both agents. actionsAllowlist is optional and shared by default.
# Advanced settings use existing per-component customConfigurations.
# https://docs.datadoghq.com/actions/private_actions/

---
# Example 1: Activation with an optional common allowlist.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actionsAllowlist:
        - com.datadoghq.script.runPredefinedScript

---
# Example 2: Optional component settings override the feature settings.
# Typed enabled/actionsAllowlist take precedence over the same keys in raw YAML.
# Omit actionsAllowlist to inherit the common list, or use [] to clear it.
# Set enabled: false on either component to disable its PAR.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-par-custom
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actionsAllowlist:
        - com.datadoghq.script.runPredefinedScript
  override:
    nodeAgent:
      customConfigurations:
        datadog.yaml:
          enabled: true
          actionsAllowlist:
            - com.datadoghq.script.runPredefinedScript
          configData: |
            private_action_runner:
              task_concurrency: 3
    clusterAgent:
      customConfigurations:
        datadog-cluster.yaml:
          enabled: true
          actionsAllowlist:
            - com.datadoghq.script.runPredefinedScript
          configData: |
            private_action_runner:
              task_concurrency: 5
