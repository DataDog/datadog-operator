# Enable PAR on both agents. actionsAllowlist is optional and shared by default.
# Advanced settings use existing per-component customConfigurations.
# https://docs.datadoghq.com/actions/private_actions/

---
# Example 1: Activation with an optional common allowlist.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actionsAllowlist:
        - com.datadoghq.script.runPredefinedScript

---
# Example 2: Optional component settings override the feature settings.
# Typed enabled/actionsAllowlist take precedence over the same keys in raw YAML.
# Omit actionsAllowlist to inherit the common list, or use [] to clear it.
# Set enabled: false on either component to disable its PAR.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-par-custom
  # Optional host integrations are configured with annotations:
  # annotations:
  #   # Grant PAR access to host systemd and select persistent, volatile, or both journal stores.
  #   agent.datadoghq.com/private-action-runner-systemd-enabled: "true"
  #   agent.datadoghq.com/private-action-runner-systemd-journal-storage: "persistent"
  #   # Allow journal vacuum actions to delete archived journals in the selected directories.
  #   agent.datadoghq.com/private-action-runner-systemd-journal-vacuum-enabled: "true"
  #   # Expose system-probe's capture-only socket to PAR (requires Agent >= 7.86.0).
  #   agent.datadoghq.com/private-action-runner-packet-capture-enabled: "true"
spec:
  global:
    clusterName: my-cluster
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    site: datadoghq.com
  features:
    privateActionRunner:
      enabled: true
      actionsAllowlist:
        - com.datadoghq.script.runPredefinedScript
  override:
    nodeAgent:
      customConfigurations:
        datadog.yaml:
          enabled: true
          actionsAllowlist:
            - com.datadoghq.script.runPredefinedScript
          configData: |
            private_action_runner:
              task_concurrency: 3
    clusterAgent:
      customConfigurations:
        datadog-cluster.yaml:
          enabled: true
          actionsAllowlist:
            - com.datadoghq.script.runPredefinedScript
          configData: |
            private_action_runner:
              task_concurrency: 5
