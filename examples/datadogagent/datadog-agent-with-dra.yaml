apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  features:
    # Mounts the host CDI spec directory so the Agent can attribute GPUs allocated through DRA to pods.
    gpu:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
      conf:
        # configData replaces the default collector list, so it repeats the full default list
        # and adds the DRA collectors at the end.
        configData: |-
          cluster_check: false
          init_config:
          instances:
            - skip_leader_election: false
              # Optional: only count claims requesting these DeviceClasses.
              # dra_device_classes:
              #   - gpu.nvidia.com
              collectors:
              - pods
              - replicationcontrollers
              - statefulsets
              - nodes
              - cronjobs
              - jobs
              - replicasets
              - deployments
              - configmaps
              - services
              - endpoints
              - endpointslices
              - daemonsets
              - horizontalpodautoscalers
              - poddisruptionbudgets
              - limitranges
              - resourcequotas
              - secrets
              - namespaces
              - persistentvolumeclaims
              - persistentvolumes
              - ingresses
              - storageclasses
              - volumeattachments
              # Add verticalpodautoscalers if the VPA CRDs are installed.
              - apiservices
              - controllerrevisions
              - customresourcedefinitions
              # DRA collectors: require Cluster Agent 7.85.0+.
              # resourceclaims and resourceslices need Kubernetes 1.34+, devicetaintrules needs 1.37+;
              # the Agent skips collectors whose API the cluster does not serve.
              - resourceclaims
              - resourceslices
              - devicetaintrules
  global:
    credentials:
      apiKey: <DATADOG_API_KEY>
      appKey: <DATADOG_APP_KEY>
    clusterName: foo
  override:
    # The operator grants the resource.k8s.io RBAC only for Cluster Agent 7.85.0+.
    clusterAgent:
      image:
        tag: "7.85.0"
    # GPU attribution for DRA pods needs Agent 7.85.0+.
    nodeAgent:
      image:
        tag: "7.85.0"
