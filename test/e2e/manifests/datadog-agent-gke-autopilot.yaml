apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog-agent-gke-autopilot
  namespace: e2e-operator
  labels:
    agent.datadoghq.com/e2e-test: datadog-agent-gke-autopilot
  annotations:
    experimental.agent.datadoghq.com/autopilot: "true"
spec:
  override:
    nodeAgent:
      image:
        # Exercise the next Agent release rather than the Operator's stable default.
        tag: 7-rc
        pullPolicy: Always
    clusterAgent:
      image:
        tag: rc
        pullPolicy: Always
  features:
    kubeStateMetricsCore:
      enabled: true
    orchestratorExplorer:
      enabled: true
    liveContainerCollection:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    npm:
      enabled: true
