# Helm values for the operator in the component-health suite.
# RBAC/CRDs come from the e2e kustomize; the operator uses the shared SA.
#
# Enables the ComponentHealth controller (detection). The intake emitter and its
# target URL are injected by the suite at runtime (DD_COMPONENT_HEALTH_INTAKE_*)
# once the fakeintake URL is known, since that URL is dynamic and not available
# when these static values are rendered. The feature is turned on via env because
# the chart has no dedicated knob for it yet; the operator applies env before
# flag.Parse(), and nothing renders a competing -componentHealthEnabled flag, so
# DD_COMPONENT_HEALTH_* wins.
# ${NAMESPACE} is substituted with the operator/DDA namespace at load time.
installCRDs: false
rbac:
  create: false
serviceAccount:
  create: false
  name: datadog-operator-e2e-controller-manager
env:
  - name: DD_COMPONENT_HEALTH_ENABLED
    value: "true"
  - name: DD_COMPONENT_HEALTH_SNAPSHOT_INTERVAL
    value: "30s"
  - name: DD_AGENT_WATCH_NAMESPACE
    value: "${NAMESPACE}"
