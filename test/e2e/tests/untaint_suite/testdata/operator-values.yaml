# Helm values for the operator in the untaint suite (agent-only mode).
# RBAC/CRDs come from the e2e kustomize; the operator uses the shared SA.
#
# Untaint must be enabled via the chart's `untaintController.*` knobs (which
# render `-untaintControllerEnabled=...` CLI flags). Setting only the
# DD_UNTAINT_* env vars is NOT enough: the operator applies env before
# flag.Parse(), so an explicit `-untaintControllerEnabled=false` from the chart
# wins and the controller never starts / never injects the startup toleration.
#
# Timeouts are high with policy=keep so the ONLY way the taint gets removed
# during the test is genuine Agent readiness (a timeout firing would keep the
# taint and fail the test rather than mask a bug).
# ${NAMESPACE} is substituted with the operator/DDA namespace at load time.
installCRDs: false
rbac:
  create: false
serviceAccount:
  create: false
  name: datadog-operator-e2e-controller-manager
untaintController:
  enabled: true
  timeoutPolicy: keep
  timeout: "30m"
  schedulingTimeout: "30m"
  eventsEnabled: true
env:
  - name: DD_AGENT_WATCH_NAMESPACE
    value: "${NAMESPACE}"
