# Helm values for the operator in the untaint suite (wait-for-CSI mode).
# Same as operator-values.yaml plus waitForCSIDriver (dual-readiness gate).
# See operator-values.yaml for why untaintController.* (not only DD_* env) is required.
# ${NAMESPACE} is substituted with the operator/DDA namespace at load time.
installCRDs: false
rbac:
  create: false
serviceAccount:
  create: false
  name: datadog-operator-e2e-controller-manager
untaintController:
  enabled: true
  waitForCSIDriver: true
  timeoutPolicy: keep
  timeout: "30m"
  schedulingTimeout: "30m"
  eventsEnabled: true
datadogCSIDriver:
  enabled: true
env:
  - name: DD_AGENT_WATCH_NAMESPACE
    value: "${NAMESPACE}"
  - name: DD_CSIDRIVER_WATCH_NAMESPACE
    value: "${NAMESPACE}"
