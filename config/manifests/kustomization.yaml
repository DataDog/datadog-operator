resources:
- ../default
- ../samples
- ../scorecard
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# BYOC, including the Observability Pipelines Worker CRD, is not shipped in the OLM bundle: OLM merges every
# ClusterRole bound to the operator into the CSV, so its CRDs and RBAC would reach all OpenShift users.
patches:
- patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: datadogbyocclusters.datadoghq.com
- patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: datadogobservabilitypipelinesworkers.datadoghq.com
- patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: datadog-operator-manager-byoc-role
- patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: datadog-operator-manager-byoc-rolebinding
