apiVersion: datadoghq.com/v1alpha1
kind: DatadogBYOCCluster
metadata:
  name: datadogbyoccluster-sample
  namespace: byoc
spec:
  # Optional: mirror workload images while retaining the default versions.
  # imageOverrides:
  #   byoc:
  #     repository: registry.example.com/datadog/byoc
  #     pullPolicy: IfNotPresent
  #     imagePullSecrets:
  #       - name: workload-registry-credentials
  #   observabilityPipelinesWorker:
  #     repository: registry.example.com/datadog/observability-pipelines-worker
  #     pullPolicy: IfNotPresent
  #     imagePullSecrets:
  #       - name: workload-registry-credentials
  datadog:
    site: datadoghq.com
    apiKeySecretRef:
      name: datadog-secret
      key: api-key
    byocTelemetry: true
    dogstatsdServer:
      host: dogstatsd.monitoring.svc
      port: 8125
  provider:
    aws:
      accountID: "123456789012"
      region: us-east-1
      partition: aws
      irsaRoleARN: arn:aws:iam::123456789012:role/byoclogs
  # Optional: use an existing ServiceAccount instead of creating one.
  # Configure IRSA on the existing account yourself; irsaRoleARN above only applies to generated accounts.
  # identity:
  #   serviceAccountName: byoclogs
  global:
    labels:
      team: byoc-logs
  # Optional: manage the log indexes and the routing table. The order is the routing order, and the first index whose
  # filter matches a log receives it. Logs that match no index are dropped. When set, main must be listed, changes
  # made in the Datadog UI are reverted, and indexes that are not listed are deleted with their data. Leave it unset
  # to manage the indexes in the UI.
  # indexes:
  #   - name: payment
  #     filter: "service:payment"
  #     retention: 90 days
  #   - name: security
  #     filter: "source:cloudtrail"
  #   - name: main
  #     filter: "*"
  components:
    metastore:
      database:
        uriSecretRef:
          name: byoc-postgres
          key: primary-uri
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    readOnlyMetastore:
      database:
        uriSecretRef:
          name: byoc-postgres
          key: read-only-metastore-uri
      replicas: 2
    indexer:
      replicas: 2
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          memory: 32Gi
      autoscaling:
        minReplicas: 2
        maxReplicas: 10
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
      storage:
        volumeClaimTemplate:
          metadata:
            annotations:
              example.com/storage: indexer
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: gp3
            resources:
              requests:
                storage: 30Gi
    searcher:
      replicas: 2
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
        limits:
          memory: 16Gi
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: gp3
            resources:
              requests:
                storage: 50Gi
    pipelines:
      - name: logs
        pipelineID: 11111111-2222-3333-4444-555555555555
        ports:
          - name: otlp-grpc
            port: 4317
          - name: otlp-http
            port: 4318
        replicas: 2
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            memory: 4Gi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: gp3
              resources:
                requests:
                  storage: 30Gi
      - name: audit
        pipelineID: 66666666-7777-8888-9999-000000000000
        ports:
          - name: http
            port: 8080
        replicas: 1
    controlPlane:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
    compactor:
      replicas: 2
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
    janitor:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
  nodeConfigOverrides:
    version: 0.8
    default_index_root_uri: s3://byoc-logs/indexes
    indexer:
      enable_otlp_endpoint: true
