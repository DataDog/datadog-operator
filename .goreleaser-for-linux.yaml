version: 2
before:
  hooks:
    - go mod download
    - go generate ./...
builds:
- id: kubectl-datadog
  goos:
  - linux
  goarch:
  - amd64
  - arm64
  env:
  - CGO_ENABLED=1
  overrides:
  - goos: linux
    goarch: arm64
    env:
      - CC=aarch64-linux-gnu-gcc
  main: ./cmd/kubectl-datadog/main.go
  ldflags:
  - -w -s
  - -X github.com/DataDog/datadog-operator/pkg/version.Commit={{ .FullCommit }}
  - -X github.com/DataDog/datadog-operator/pkg/version.Version={{ .Version }}
  - -X github.com/DataDog/datadog-operator/pkg/version.BuildTime={{ .Date }}
  binary: kubectl-datadog
archives:
- id: kubectl-datadog
  builds:
  - kubectl-datadog
  name_template: "kubectl-datadog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  wrap_in_directory: false
  format: zip
  files:
  - LICENSE
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
