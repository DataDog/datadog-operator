name: "Chase teams for QA cards"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.0)'
        required: true
        type: string

permissions: {}

jobs:
  chase_for_qa_cards:
    runs-on: ubuntu-latest
    environment:
      name: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install atlassian-python-api slack_sdk pyyaml
      - name: Chase for QA cards
        env:
          ATLASSIAN_USERNAME: ${{ secrets.ATLASSIAN_USERNAME }}
          ATLASSIAN_PASSWORD: ${{ secrets.ATLASSIAN_PASSWORD }}
          SLACK_DATADOG_AGENT_BOT_TOKEN: ${{ secrets.SLACK_DATADOG_AGENT_BOT_TOKEN }}
        run: python hack/release/chase_qa_cards.py --version "${{ github.event.inputs.version }}"
