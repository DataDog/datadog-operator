name: Operator Release - Make Bundle
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check out, regenerate bundle on, and push back to"
        required: true
        type: string
      version:
        description: "New release version, (e.g. 1.27.0-rc.1)"
        required: true
        type: string
      latest_version:
        description: "Previous released version, (e.g. 1.26.0)"
        required: true
        type: string
      correlation_id:
        description: "Correlation ID, surfaced in run-name so the caller can find this run"
        required: true
        type: string

run-name: "operator release - make bundle ${{ inputs.version }} [${{ inputs.correlation_id }}]"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Generate bundle
        run: make bundle VERSION=${{ inputs.version }} LATEST_VERSION=${{ inputs.latest_version }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No bundle changes to commit"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made via the GitHub API are automatically signed by GitHub
      - name: Commit bundle (signed via GitHub API)
        if: steps.changes.outputs.has_changes == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore(bundle): regenerate for v${{ inputs.version }}"
          repo: ${{ github.repository }}
          branch: ${{ inputs.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
