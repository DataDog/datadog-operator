---
name: PR Milestone

on:
  pull_request_target:
    types: [opened]
    branches: [main]

# pull_request_target runs in the base-branch context, so GITHUB_TOKEN has
# write access to the repo even for fork PRs. Safe here because no code from
# the PR branch is checked out or executed.
permissions:
  pull-requests: write
  issues: write

jobs:
  milestone:
    name: Set latest milestone
    runs-on: ubuntu-latest
    steps:
      - name: Apply highest open milestone
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Re-fetch the PR in case a milestone was set after the event fired.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.milestone) {
              core.info(`PR already has milestone ${pr.milestone.title}, skipping.`);
              return;
            }

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'open', per_page: 100,
            });

            // Only consider semver-like titles (e.g. v1.32.0) and pick the highest.
            const semver = /^v?(\d+)\.(\d+)\.(\d+)$/;
            const latest = milestones
              .map(m => ({ m, v: (m.title.match(semver) || []).slice(1).map(Number) }))
              .filter(({ v }) => v.length === 3)
              .sort((a, b) => b.v[0] - a.v[0] || b.v[1] - a.v[1] || b.v[2] - a.v[2])[0];

            if (!latest) {
              core.warning('No open semver milestone found, skipping.');
              return;
            }

            core.info(`Setting milestone ${latest.m.title} on PR #${prNumber}`);
            await github.rest.issues.update({
              owner, repo, issue_number: prNumber, milestone: latest.m.number,
            });
